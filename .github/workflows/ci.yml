name: CI

on:
  push:
    paths-ignore:
      # 纯文档/笔记改动不触发 CI（README、学习笔记等）
      - '**.md'
      - 'learn/**'
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # --config/-C 在单配置生成器下被忽略，在多配置生成器（MSVC）下生效，
        # 因此同一套命令兼容三平台
        run: cmake -S SimpleInferQueue -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # 数据竞争检测：ThreadSanitizer 内置完整的 C++ 内存模型（happens-before 分析），
  # 能抓出功能测试发现不了的 atomics 误用与内存序错误。仅 Linux 可用（MSVC 无 TSAN），
  # 且是动态检测——只能覆盖测试实际跑到的执行路径
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with TSAN
        run: >
          cmake -S SimpleInferQueue -B build-tsan
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1"
          -DSIMPLEINFERQUEUE_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build-tsan

      - name: Test under ThreadSanitizer
        run: ctest --test-dir build-tsan --output-on-failure

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        # 固定版本，与本地开发环境保持一致
        run: pip install clang-format==18.1.8

      - name: Check formatting
        # 只扫描明确的源码目录，避免误扫到任何构建目录里的生成文件
        run: |
          find SimpleInferQueue/include SimpleInferQueue/examples \
               SimpleInferQueue/tests SimpleInferQueue/benchmarks \
               \( -name '*.h' -o -name '*.cpp' \) -print \
            | xargs clang-format --dry-run --Werror
